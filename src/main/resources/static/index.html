<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinema Ticket Reservations</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div>
        <p class="eyebrow">Service Builder Cinema</p>
        <h1>Movie Tickets</h1>
      </div>
      <button id="refreshButton" class="secondary" type="button">Refresh</button>
    </section>

    <section id="status" class="status" hidden></section>

    <section class="layout">
      <div>
        <h2>Now Showing</h2>
        <div id="movieGrid" class="movie-grid" aria-live="polite"></div>
      </div>

      <aside class="reservation-panel">
        <h2>Reserve Tickets</h2>
        <div id="selectionEmpty" class="empty">
          Select a showtime from the movie grid.
        </div>
        <form id="reservationForm" hidden>
          <div class="selected-showtime">
            <strong id="selectedTitle"></strong>
            <span id="selectedMeta"></span>
          </div>
          <label for="ticketQuantity">Number of tickets</label>
          <input id="ticketQuantity" name="quantity" type="number" min="1" value="1" required>
          <button id="reserveButton" type="submit">Reserve</button>
        </form>
        <div id="reservationResult" class="result" hidden></div>
      </aside>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
