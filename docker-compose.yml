services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service_builder_app
    hostname: app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vdt_query
      SPRING_DATASOURCE_USERNAME: longlh20
      SPRING_DATASOURCE_PASSWORD: 123123aA@
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CAMUNDA_CLIENT_GRPC_ADDRESS: http://zeebe:26500
      CAMUNDA_CLIENT_REST_ADDRESS: http://zeebe:8080
      EUREKA_CLIENT_ENABLED: "false"
      EUREKA_CLIENT_SHOULD_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_SHOULD_FETCH_REGISTRY: "false"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "7554:7554"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      zeebe:
        condition: service_healthy
    networks:
      service_builder:
        aliases:
          - app

  postgres:
    image: postgres:16
    container_name: service_builder_postgres
    hostname: postgres
    environment:
      POSTGRES_DB: vdt_query
      POSTGRES_USER: longlh20
      POSTGRES_PASSWORD: 123123aA@
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      service_builder:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longlh20 -d vdt_query"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: service_builder_zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      service_builder:
        aliases:
          - zookeeper

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: service_builder_kafka
    hostname: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      service_builder:
        aliases:
          - kafka

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.15.3}
    container_name: service_builder_elasticsearch
    hostname: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      service_builder:
        aliases:
          - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 15s
      timeout: 5s
      retries: 10

  zeebe:
    image: camunda/zeebe:${CAMUNDA_ZEEBE_VERSION:-8.8.0-alpha5}
    container_name: service_builder_zeebe
    hostname: zeebe
    environment:
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME: io.camunda.zeebe.exporter.ElasticsearchExporter
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL: http://elasticsearch:9200
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE: "1"
      ZEEBE_BROKER_DATA_DISKUSAGECOMMANDWATERMARK: "0.998"
      ZEEBE_BROKER_DATA_DISKUSAGEREPLICATIONWATERMARK: "0.999"
      CAMUNDA_DATABASE_URL: http://elasticsearch:9200
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx512m
    ports:
      - "26500:26500"
      - "8080:8080"
      - "9600:9600"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - zeebe_data:/usr/local/zeebe/data
    networks:
      service_builder:
        aliases:
          - zeebe
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/9600' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  operate:
    image: camunda/operate:${CAMUNDA_OPERATE_VERSION:-8.8.0-alpha5}
    container_name: service_builder_operate
    hostname: operate
    environment:
      CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS: zeebe:26500
      CAMUNDA_OPERATE_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_OPERATE_CSRFPREVENTIONENABLED: "false"
      CAMUNDA_DATABASE_URL: http://elasticsearch:9200
      management.endpoints.web.exposure.include: health
      management.endpoint.health.probes.enabled: "true"
    ports:
      - "${OPERATE_PORT:-8081}:8080"
    depends_on:
      zeebe:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      service_builder:
        aliases:
          - operate

volumes:
  postgres_data:
  elastic_data:
  zeebe_data:

networks:
  service_builder:
    name: service_builder
    driver: bridge
