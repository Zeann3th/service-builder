services:
  postgres:
    image: postgres:16
    container_name: service_builder_postgres
    environment:
      POSTGRES_DB: vdt_query
      POSTGRES_USER: longlh20
      POSTGRES_PASSWORD: 123123aA@
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longlh20 -d vdt_query"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.15.3}
    container_name: service_builder_elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 15s
      timeout: 5s
      retries: 10

  zeebe:
    image: camunda/zeebe:${CAMUNDA_ZEEBE_VERSION:-8.8.0-alpha5}
    container_name: service_builder_zeebe
    environment:
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME: io.camunda.zeebe.exporter.ElasticsearchExporter
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL: http://elasticsearch:9200
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE: "1"
      ZEEBE_BROKER_DATA_DISKUSAGECOMMANDWATERMARK: "0.998"
      ZEEBE_BROKER_DATA_DISKUSAGEREPLICATIONWATERMARK: "0.999"
      CAMUNDA_DATABASE_URL: http://elasticsearch:9200
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx512m
    ports:
      - "26500:26500"
      - "8080:8080"
      - "9600:9600"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - zeebe_data:/usr/local/zeebe/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/9600' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  operate:
    image: camunda/operate:${CAMUNDA_OPERATE_VERSION:-8.8.0-alpha5}
    container_name: service_builder_operate
    environment:
      CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS: zeebe:26500
      CAMUNDA_OPERATE_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_OPERATE_CSRFPREVENTIONENABLED: "false"
      CAMUNDA_DATABASE_URL: http://elasticsearch:9200
      management.endpoints.web.exposure.include: health
      management.endpoint.health.probes.enabled: "true"
    ports:
      - "8081:8080"
    depends_on:
      zeebe:
        condition: service_healthy

volumes:
  postgres_data:
  elastic_data:
  zeebe_data:
